<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none">
  <!--
    Cadaster logo — icon + wordmark
    Brand colors:
      Primary teal:  #0d6e6e
      Accent amber:  #e89d3a
  -->

  <!-- ── Icon: map-pin whose inner dot is replaced by a checkmark ── -->
  <g transform="translate(4, 2)">
    <!-- Pin body -->
    <path
      d="M20 2C13.373 2 8 7.373 8 14c0 9 12 26 12 26s12-17 12-26c0-6.627-5.373-12-12-12z"
      fill="#0d6e6e"
    />
    <!-- White circle cutout -->
    <circle cx="20" cy="14" r="7" fill="white"/>
    <!-- Amber checkmark inside pin -->
    <polyline
      points="15,14 18.5,17.5 25,10.5"
      stroke="#e89d3a"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Pin shadow dot -->
    <ellipse cx="20" cy="41" rx="4" ry="1.5" fill="#0d6e6e" opacity="0.25"/>
  </g>

  <!-- ── Wordmark ── -->
  <text
    x="54"
    y="30"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#0d6e6e"
  >Cadaster</text>

  <!-- Tagline -->
  <text
    x="55"
    y="44"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="8.5"
    letter-spacing="0.5"
    fill="#6b7280"
  >GEO-VERIFICATION ORACLE</text>
</svg>
