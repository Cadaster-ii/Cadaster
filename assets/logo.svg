<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" role="img" aria-label="Cadaster — Geo-verification oracle">
  <title>Cadaster</title>

  <!--
    Full lockup: icon on the left, wordmark + tagline on the right.
    All text is rendered as <text> with generic sans-serif stack.
    GitHub renders this correctly in <img> tags (not inline SVG).
    Brand colors: teal #0d6e6e  amber #e89d3a
  -->

  <!-- ── Icon (64×64 scaled to 56×56, centred vertically) ── -->
  <g transform="translate(4, 4)">
    <!-- Pin body -->
    <path
      d="M28 2C19.163 2 12 9.163 12 18
         C12 28.375 28 52 28 52
         C28 52 44 28.375 44 18
         C44 9.163 36.837 2 28 2Z"
      fill="#0d6e6e"
    />
    <!-- White circle -->
    <circle cx="28" cy="18" r="9.5" fill="white"/>
    <!-- Amber check -->
    <polyline
      points="21,18 25.5,22.5 35,13"
      stroke="#e89d3a"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Shadow dot -->
    <ellipse cx="28" cy="53" rx="5" ry="1.8" fill="#0d6e6e" opacity="0.18"/>
  </g>

  <!-- ── Wordmark ── -->
  <text
    x="68"
    y="36"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#0d6e6e"
  >Cadaster</text>

  <!-- ── Tagline ── -->
  <text
    x="69"
    y="52"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="10"
    font-weight="400"
    letter-spacing="1.2"
    fill="#6b7280"
  >GEO-VERIFICATION ORACLE</text>

  <!-- Accent underline below wordmark -->
  <line x1="68" y1="40" x2="228" y2="40" stroke="#e89d3a" stroke-width="2" opacity="0.5"/>
</svg>
