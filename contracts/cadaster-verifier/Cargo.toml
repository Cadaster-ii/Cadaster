[package]
name = "cadaster-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
cadaster-attester-registry = { path = "../cadaster-attester-registry" }

[dev-dependencies]
soroban-sdk = { workspace = true }
# Must match the exact version soroban-sdk 29 uses in its testutils
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }

[features]
testutils = [
    "soroban-sdk/testutils",
    "cadaster-attester-registry/testutils",
]
